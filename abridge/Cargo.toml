[package]
name = "abridge"
version = "0.1.0"
authors = ["David Roundy <daveroundy@gmail.com>"]
edition = "2021"
build = "build.rs"
default-run = "abridge"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

bridge-deck = { version = "0.1.1", path = "..", features = ["display-as"] }
robot = { version = "0.1.0", path = "../robot" }

serde_json = "1.0"
percent-encoding = "2.3.0"
rand = "0.8.0"
memorable-wordlist = "0.1.7"
lets-encrypt-warp = "0.3.1"
clap = { version = "4.4.3", features = ["derive"] }
warp = "0.3.0"
tokio = { version = "1.32.0", features = ["full", "time"] }
futures = "0.3.28"
axum = { version = "0.8", features = ["ws"] }
hyper = "0.14.23"
http = "0.2.8"
internment = "0.7.0"
dashmap = "5.5.3"

display-as = { version = "0.7.0", features = ["warp"] }
rustls-acme = { version = "0.15.4", default-features = false, features = ["ring", "axum", "webpki-roots", "tls12"] }
axum-server = "0.8"
axum-extra = { version = "0.12.6", features = ["cookie"] }

[dev-dependencies]
tokio-tungstenite = "0.21.0"

[profile.release]
lto = true
