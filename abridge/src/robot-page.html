<!DOCTYPE html>
<html>

<head>
    <title> Robot</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
    <script type="module">
        import init, { choose_play, choose_play_by_model } from '/robot.js';
        await init();

        // Who plays the cards: the robot, or the model that self-play
        // learned.  The bids are the robot's either way.  The choice is
        // remembered in this browser.
        const player = document.getElementById('player');
        try {
            player.value = localStorage.getItem('robot-player') || 'robot';
        } catch (e) {}
        player.addEventListener('change', () => {
            try {
                localStorage.setItem('robot-player', player.value);
            } catch (e) {}
        });
    
        var ws_protocol = 'ws://';
        if (location.protocol == 'https:') {
            ws_protocol = 'wss://';
        }
        const ws = new WebSocket(ws_protocol + location.host + location.pathname + '/ws');
        console.log('did websocket');
    
        ws.onopen = function () {
            console.log('connected');
        };
        ws.onmessage = async function (event) {
            document.getElementById('main').innerHTML = "Thinking...";
            const min_play_time = 1000; // Ensure each play takes at least this many ms
            const time_to_load = 100; // Time to wait before using the CPU so that the player UI doesn't get bogged down.
            await new Promise(r => setTimeout(r, time_to_load));
            const start = performance.now();
            const choose = player.value === 'model' ? choose_play_by_model : choose_play;
            let action = choose(event.data);
            const end = performance.now();
            console.log(`Chose to do ${action} based on ${event.data} which took ${end - start} ms`);
            if (end - start < min_play_time) {
                console.log('waiting a bit longer');
                await new Promise(r => setTimeout(r, min_play_time + start - end));
            }

            document.getElementById('main').innerHTML = action;
            ws.send(action);
        };
        ws.onclose = function (event) {
            console.log('disconnected');
            if (event.code == 4000) {
                // The table closed for inactivity, so the robot's job is done.
                document.getElementById('main').innerHTML = event.reason;
            } else {
                location.reload();
            }
        };
        function send_message(action) {
            ws.send(action);
        }
    </script>
    <label for="player">Cards played by
        <select id="player">
            <option value="robot">the robot</option>
            <option value="model">the model learned by self-play</option>
        </select>
    </label>
    <main id="main">Robot ai stuff here.</main>
</body>

</html>
