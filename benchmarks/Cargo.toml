# Runs the benchmarks that bridge-deck and bridge-solver register with their
# `benchmarks` feature, from both the working tree and the committed main
# branch, so that each is compared with its older self.
#
# This is its own workspace so that the baseline packages, which have the same
# names as the ones they are compared with, do not make `cargo -p bridge-deck`
# ambiguous in the main workspace.
[package]
name = "benchmarks"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dev-dependencies]

bridge-deck = { path = "..", features = ["benchmarks"] }
bridge-solver = { path = "../bridge-solver", features = ["benchmarks"] }

bridge-deck-main = { package = "bridge-deck", git = "https://github.com/droundy/bridge-cards", branch = "main", features = ["benchmarks"] }
bridge-solver-main = { package = "bridge-solver", git = "https://github.com/droundy/bridge-cards", branch = "main", features = ["benchmarks"] }

scaling = "0.10.0"

cardpack = "0.3.8"
simple-cards = "1.1.0"

[[bench]]
name = "bench"
harness = false
