[package]
name = "bridge-deck"
version = "0.1.1"
authors = ["David Roundy <daveroundy@gmail.com>"]
edition = "2021"

keywords = ["card", "deck"]

description = "Yet another library for playing cards and sets of cards"
repository = "https://github.com/droundy/bridge-cards"
readme = "README.md"
license = "MIT/Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
debug = true

[dependencies]

rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }

display-as = { version = "0.7.0", optional = true }
scaling = { version = "0.10.2", optional = true }

[features]

# Registers the benchmarks in src/benches.rs with scaling.  benchmarks/ runs
# them, against the same benchmarks from the main branch.
benchmarks = ["dep:scaling"]

[dev-dependencies]

quickcheck = "^0.9.2"

# `cargo bench` here runs the benchmarks in benchmarks/, which is its own
# workspace.
[[bench]]
name = "benchmarks"
harness = false

[workspace]

members = [
    "abridge",
    "bridge-solver",
    "robot",
    "wording"
]